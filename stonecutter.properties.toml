[mod]
id = "eg_inventory_blur"
name = "Enchanted's Template Mod"
description = "Applies the menu background blur more screens such as chests, the player inventory, etc."
group = "games.enchanted"
version = "1.3.0"
license = "CC BY-NC 4.0"
source_url = "https://github.com/Enchanted-Games/inventory-blur"
issue_tracker = "https://github.com/Enchanted-Games/inventory-blur/issues"
icon = "assets/icon.png"

# neoforge versions: https://projects.neoforged.net/neoforged/neoforge
# fabric versions: https://fabricmc.net/develop/

[fabric]
deps.fabric-loader = "0.18.5"
dep_str.fabric-loader = ">=0.18"

["26.1"]
deps.minecraft = "26.1.2"

[fabric."26.1"]
dep_str.minecraft = ">=26.1 <26.2"

deps.fabric-api = "0.147.0+26.1.2"
dep_str.fabric-api = ">=0.147.0+26.1.2"

deps.modmenu = "18.0.0-alpha.8"

[neoforge."26.1"]
dep_str.minecraft = "[26.1,26.2)"

deps.neoforge = "26.1.2.36-beta"